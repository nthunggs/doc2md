name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
            ocr: false
          - os: windows-latest
            python: '3.12'
            ocr: true
          - os: ubuntu-latest
            python: '3.12'
            ocr: false
          - os: macos-latest
            python: '3.12'
            ocr: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows environment through the shipped installer
        if: runner.os == 'Windows'
        shell: cmd
        run: python -B scripts\setup_windows.py
      - name: Install dependencies on Unix
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Install native OCR prerequisites
        if: matrix.ocr
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Tesseract-OCR'
          python -B scripts/setup_windows.py --ocr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "TESSDATA_PREFIX=$env:GITHUB_WORKSPACE\.venv\share\tessdata"
          Add-Content $env:GITHUB_ENV 'DOC2MD_TEST_OCR=1'
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe -B -m unittest discover -s tests -v
      - name: Test on Unix
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tests -v
